<!doctype html><meta charset="utf-8" />
<title>Flash Vocab</title>
<style>
  body{font-family:system-ui;margin:16px;max-width:760px}
  textarea,button{font-size:16px;width:100%}
  #card{
    margin-top:12px; padding:18px; border:1px solid #ddd; border-radius:14px;
    min-height:180px; display:flex; flex-direction:column; justify-content:center;
    user-select:none; -webkit-user-select:none;
  }
  #w{font-size:30px; font-weight:700; margin-bottom:10px}
  #m{font-size:20px; opacity:.92}
  #hint{margin-top:10px; opacity:.65}
  .row{display:flex; gap:8px; margin-top:8px}
  .row>*{flex:1}
</style>

<textarea id="src" rows="10" placeholder="ここに貼り付け（word：meaning）"></textarea>
<div class="row">
  <button id="start">START</button>
  <button id="shuffle">SHUFFLE</button>
</div>

<div id="card" title="タップでめくる / スペースでもOK">
  <div id="w">—</div>
  <div id="m"></div>
  <div id="hint">STARTして、カードをタップで「答え→次」</div>
</div>

<script>
let cards=[], i=0, showing=false;

const parse = t => t.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
  const [w,m]=l.split("：");
  return (w&&m)?{w:w.trim(), m:m.trim()}:null;
}).filter(Boolean);

function render(){
  if(!cards.length){ w.textContent="—"; m.textContent=""; hint.textContent="リストを貼ってSTART"; return; }
  const c = cards[i];
  w.textContent = c.w;
  m.textContent = showing ? c.m : "（タップで答え）";
  hint.textContent = `progress: ${i+1}/${cards.length}  |  ${showing?"次へ":"答えを見る"}`;
}

function next(){
  if(!cards.length) return;
  if(!showing){ showing=true; render(); return; }
  showing=false;
  i = (i+1) % cards.length;
  render();
}

function doShuffle(){
  for(let j=cards.length-1;j>0;j--){
    const k = (Math.random()*(j+1))|0;
    [cards[j],cards[k]]=[cards[k],cards[j]];
  }
}

start.onclick=()=>{
  cards=parse(src.value);
  i=0; showing=false;
  render();
};

shuffle.onclick=()=>{
  if(!cards.length) cards=parse(src.value);
  doShuffle();
  i=0; showing=false;
  render();
};

card.onclick=next;
document.addEventListener("keydown",e=>{
  if(e.code==="Space"){ e.preventDefault(); next(); }
});
render();
</script>
